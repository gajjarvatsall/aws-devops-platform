name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      recover_tainted_state:
        description: Clear stale taint markers on known staging resources from earlier partial applies
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: staging-terraform-state
  cancel-in-progress: false

jobs:
  apply:
    name: Apply approved staging infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "337909740274"
      AWS_REGION: ap-south-1
      TF_STATE_BUCKET: aws-vg-cloudops-tf-state
      TF_PROJECT_NAME: cloudops-demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure deployment AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::337909740274:role/cloudops-github-terraform-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-apply-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Initialize staging state
        working-directory: environments/staging
        run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$AWS_REGION"

      - name: Recover tainted resources from earlier partial creates
        if: ${{ inputs.recover_tainted_state }}
        working-directory: environments/staging
        run: |
          set -euo pipefail
          addresses=(
            aws_ssm_parameter.image_tag
            module.alb.aws_lb.this
            module.alb.aws_lb_target_group.app
            module.autoscaling.aws_autoscaling_group.app
            module.rds.aws_db_instance.this
            module.rds.aws_secretsmanager_secret.db
            module.s3.aws_s3_bucket.alb_logs
            module.s3.aws_s3_bucket.app
            'module.vpc.aws_eip.nat[0]'
            'module.vpc.aws_eip.nat[1]'
            module.vpc.aws_vpc.this
            aws_iam_role.github_app_deploy
            aws_iam_role.github_terraform_plan
            module.security_groups.aws_iam_role.ec2
          )
          state_addresses=$(terraform state list -no-color)

          for address in "${addresses[@]}"; do
            if ! grep -Fqx -- "$address" <<< "$state_addresses"; then
              echo "Skipping $address: resource is not present in state."
              continue
            fi
            state_output=$(terraform state show -no-color "$address")
            first_line=${state_output%%$'\n'*}
            if [[ "$first_line" == *"(tainted)"* ]]; then
              terraform untaint -lock-timeout=5m "$address"
            else
              echo "Skipping $address: state does not mark it tainted."
            fi
          done

      - name: Plan and apply infrastructure
        working-directory: environments/staging
        run: |
          set -euo pipefail
          if ! terraform plan -input=false -no-color -lock-timeout=5m -out="$RUNNER_TEMP/staging.tfplan" \
            -var="aws_region=$AWS_REGION" -var="terraform_state_bucket=$TF_STATE_BUCKET" \
            -var="project_name=$TF_PROJECT_NAME" -var="desired_capacity=0" -var="min_size=0" \
            > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            grep -m 8 '^Error:' "$RUNNER_TEMP/terraform-plan.log" >&2 || true
            echo "Terraform plan failed; detailed output was withheld because it can contain secrets." >&2
            exit 1
          fi
          bash ../../scripts/check-terraform-plan.sh "$RUNNER_TEMP/staging.tfplan" false
          terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/staging.tfplan"
