name: Terraform plan

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/staging/**"
      - "modules/**"
      - "bootstrap/backend/**"
      - ".github/workflows/terraform-*.yaml"
      - "scripts/check-terraform-plan.sh"

permissions:
  contents: read

concurrency:
  group: staging-terraform-state
  cancel-in-progress: false

jobs:
  plan:
    name: Plan staging infrastructure
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "337909740274"
      AWS_REGION: ap-south-1
      TF_STATE_BUCKET: aws-vg-cloudops-tf-state
      TF_PROJECT_NAME: cloudops-demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure read-only AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::337909740274:role/cloudops-github-terraform-plan
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tf-plan-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Initialize staging state
        working-directory: environments/staging
        run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$AWS_REGION"

      - name: Create speculative plan
        working-directory: environments/staging
        run: |
          set -euo pipefail
          if ! terraform plan -input=false -no-color -lock-timeout=5m -out="$RUNNER_TEMP/staging.tfplan" \
            -var="aws_region=$AWS_REGION" -var="terraform_state_bucket=$TF_STATE_BUCKET" \
            -var="project_name=$TF_PROJECT_NAME" -var="desired_capacity=0" -var="min_size=0" \
            > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            grep -m 8 '^Error:' "$RUNNER_TEMP/terraform-plan.log" >&2 || true
            echo "Terraform plan failed; detailed output was withheld because it can contain secrets." >&2
            exit 1
          fi
          terraform show -json "$RUNNER_TEMP/staging.tfplan" |
            jq -r '.resource_changes[]? | "\(.address): \(.change.actions | join(","))"'
          echo "This is a speculative PR plan. It is not applied."
