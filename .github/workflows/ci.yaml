name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement app/requirements-dev.txt

      - name: Run application tests
        run: python -m pytest app/tests

      - name: Lint application
        run: python -m ruff check app

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement app/requirements-dev.txt

      - name: Check for committed credentials
        run: ./scripts/validate-config.sh

      - name: Build application image
        run: docker build --tag cloudops-demo:${GITHUB_SHA} ./app

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform configurations
        run: |
          set -euo pipefail
          for directory in bootstrap/backend environments/staging modules/*; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate -no-color
          done
