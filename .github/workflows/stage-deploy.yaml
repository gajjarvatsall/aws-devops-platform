name: Stage deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this run to staging
        required: true
        default: false
        type: boolean
      bootstrap:
        description: Create staging infrastructure from an empty Terraform state
        required: true
        default: false
        type: boolean
      image_tag:
        description: Existing immutable ECR tag to roll back to (leave blank to build this commit)
        required: false
        type: string
      allow_destroy:
        description: Allow Terraform plans that delete or replace resources
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TERRAFORM_VERSION: "1.15.8"
  PYTHON_VERSION: "3.12"
  AWS_ACCOUNT_ID: "337909740274"
  AWS_REGION: "ap-south-1"
  AWS_DEPLOY_ROLE_ARN: "arn:aws:iam::337909740274:role/cloudops-github-terraform-deploy"
  TF_STATE_BUCKET: "aws-vg-cloudops-tf-state"
  TF_STATE_REGION: "ap-south-1"
  TF_PROJECT_NAME: "cloudops-demo"
  TF_DESIRED_CAPACITY: "1"
  TF_MIN_SIZE: "1"
  TF_MAX_SIZE: "4"
  TF_NAT_GATEWAY_COUNT: "2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

concurrency:
  group: stage-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement app/requirements-dev.txt

      - name: Run application tests
        run: python -m pytest app/tests

      - name: Lint application
        run: python -m ruff check app

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement app/requirements-dev.txt

      - name: Check for committed credentials
        run: ./scripts/validate-config.sh

      - name: Build application image
        run: docker build --tag cloudops-demo:${GITHUB_SHA} ./app

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform configurations
        run: |
          set -euo pipefail
          for directory in bootstrap/backend environments/staging modules/*; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate -no-color
          done

  deploy_staging:
    name: Deploy staging
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate deployment settings
        run: |
          set -euo pipefail
          test "$AWS_ACCOUNT_ID" = "337909740274"
          test "$AWS_DEPLOY_ROLE_ARN" = "arn:aws:iam::$AWS_ACCOUNT_ID:role/cloudops-github-terraform-deploy"
          test -n "$AWS_REGION"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_REGION"
          test -n "$TF_PROJECT_NAME"
          [[ "$TF_DESIRED_CAPACITY" =~ ^[1-9][0-9]*$ ]]
          [[ "$TF_MIN_SIZE" =~ ^[1-9][0-9]*$ ]]
          [[ "$TF_MAX_SIZE" =~ ^[1-9][0-9]*$ ]]
          (( TF_MIN_SIZE <= TF_DESIRED_CAPACITY && TF_DESIRED_CAPACITY <= TF_MAX_SIZE ))
          [[ "$TF_NAT_GATEWAY_COUNT" =~ ^[1-2]$ ]]
          if [[ "${{ inputs.bootstrap }}" == "true" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Bootstrap can only be started with workflow_dispatch." >&2
            exit 1
          fi
          if [[ "${{ inputs.bootstrap }}" == "true" && -n "${{ inputs.image_tag }}" ]]; then
            echo "Do not combine bootstrap with a rollback image tag." >&2
            exit 1
          fi

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: stage-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Confirm AWS identity
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACTUAL_ACCOUNT" = "$AWS_ACCOUNT_ID"
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json

      - name: Initialize staging state
        working-directory: environments/staging
        run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$TF_STATE_REGION"

      - name: Verify bootstrap or existing deployment state
        id: state
        working-directory: environments/staging
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          if [[ "$BOOTSTRAP" == "true" ]]; then
            if terraform output -raw ecr_repository_url >/dev/null 2>&1; then
              echo "Staging already has Terraform outputs. Run a normal deployment instead of bootstrap." >&2
              exit 1
            fi
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          else
            if ! terraform output -raw ecr_repository_url >/dev/null 2>&1; then
              echo "No initialized staging deployment was found. Start workflow_dispatch with bootstrap=true." >&2
              exit 1
            fi
            echo "mode=rollout" >> "$GITHUB_OUTPUT"
          fi

      - name: Create zero-capacity foundation
        if: steps.state.outputs.mode == 'bootstrap'
        working-directory: environments/staging
        run: |
          set -euo pipefail
          if ! terraform plan -input=false -no-color -out=foundation.tfplan \
            -var="aws_region=$AWS_REGION" -var="project_name=$TF_PROJECT_NAME" \
            -var="nat_gateway_count=$TF_NAT_GATEWAY_COUNT" -var="image_tag=bootstrap" \
            -var="desired_capacity=0" -var="min_size=0" -var="max_size=$TF_MAX_SIZE" \
            > "$RUNNER_TEMP/foundation-plan.log" 2>&1; then
            grep -m 5 '^Error:' "$RUNNER_TEMP/foundation-plan.log" >&2 || true
            echo "Terraform foundation planning failed. Detailed plan output was withheld from the Actions log." >&2
            exit 1
          fi
          bash ../../scripts/check-terraform-plan.sh foundation.tfplan false
          terraform apply -input=false foundation.tfplan

      - name: Read ECR repository
        id: ecr
        working-directory: environments/staging
        run: |
          set -euo pipefail
          REPOSITORY="$(terraform output -raw ecr_repository_url)"
          EXPECTED_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ACTUAL_REGISTRY="${REPOSITORY%%/*}"
          if [[ "$REPOSITORY" != "$EXPECTED_REGISTRY/"* ]]; then
            echo "Terraform state ECR output does not match the deployment account/region." >&2
            echo "Expected registry: $EXPECTED_REGISTRY" >&2
            echo "State registry:    $ACTUAL_REGISTRY" >&2
            exit 1
          fi
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        env:
          ECR_REPOSITORY: ${{ steps.ecr.outputs.repository }}
        run: |
          set -euo pipefail
          REGISTRY="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build or verify immutable application image
        id: image
        env:
          ECR_REPOSITORY: ${{ steps.ecr.outputs.repository }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          REPOSITORY_NAME="${ECR_REPOSITORY#*/}"
          IMAGE_TAG="${REQUESTED_TAG:-sha-${GITHUB_SHA}}"
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          ERROR_FILE="$RUNNER_TEMP/ecr-describe-error"

          if [[ -n "$REQUESTED_TAG" ]]; then
            if ! aws ecr describe-images --repository-name "$REPOSITORY_NAME" \
              --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>"$ERROR_FILE"; then
              cat "$ERROR_FILE" >&2
              exit 1
            fi
            docker pull "$ECR_REPOSITORY:$IMAGE_TAG"
            REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ECR_REPOSITORY:$IMAGE_TAG")"
            [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
            echo "Using existing immutable rollback image $IMAGE_TAG at $REVISION"
          elif aws ecr describe-images --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>"$ERROR_FILE"; then
            docker pull "$ECR_REPOSITORY:$IMAGE_TAG"
            REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ECR_REPOSITORY:$IMAGE_TAG")"
            test "$REVISION" = "$GITHUB_SHA"
            echo "Reusing the image already built for this commit."
          else
            if ! grep -q 'ImageNotFoundException' "$ERROR_FILE"; then
              cat "$ERROR_FILE" >&2
              exit 1
            fi
            docker build --pull \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "$ECR_REPOSITORY:$IMAGE_TAG" ./app
            docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Plan and apply staging rollout
        working-directory: environments/staging
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          set -euo pipefail
          if ! terraform plan -input=false -no-color -out=rollout.tfplan \
            -var="aws_region=$AWS_REGION" -var="project_name=$TF_PROJECT_NAME" \
            -var="nat_gateway_count=$TF_NAT_GATEWAY_COUNT" -var="image_tag=$IMAGE_TAG" \
            -var="desired_capacity=$TF_DESIRED_CAPACITY" \
            -var="min_size=$TF_MIN_SIZE" -var="max_size=$TF_MAX_SIZE" \
            > "$RUNNER_TEMP/rollout-plan.log" 2>&1; then
            grep -m 5 '^Error:' "$RUNNER_TEMP/rollout-plan.log" >&2 || true
            echo "Terraform rollout planning failed. Detailed plan output was withheld from the Actions log." >&2
            exit 1
          fi
          bash ../../scripts/check-terraform-plan.sh rollout.tfplan "$ALLOW_DESTROY"
          terraform apply -input=false rollout.tfplan

      - name: Wait for healthy application targets
        working-directory: environments/staging
        env:
          EXPECTED_TARGETS: ${{ env.TF_DESIRED_CAPACITY }}
        run: |
          set -euo pipefail
          TARGET_GROUP_ARN="$(terraform output -raw target_group_arn)"
          ALB_DNS_NAME="$(terraform output -raw alb_dns_name)"
          DEADLINE=$((SECONDS + 900))
          HEALTHY=0
          while (( SECONDS < DEADLINE )); do
            HEALTHY="$(aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' --output text)"
            if (( HEALTHY >= EXPECTED_TARGETS )); then
              break
            fi
            sleep 15
          done
          if (( HEALTHY < EXPECTED_TARGETS )); then
            aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'TargetHealthDescriptions[].{Target:Target.Id,State:TargetHealth.State,Reason:TargetHealth.Reason}' \
              --output table
            echo "Timed out waiting for $EXPECTED_TARGETS healthy application target(s)." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 10 --retry-delay 6 \
            "http://$ALB_DNS_NAME/health"
          echo "Staging is healthy at http://$ALB_DNS_NAME"
