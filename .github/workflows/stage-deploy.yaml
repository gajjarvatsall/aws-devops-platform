name: Stage deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable tag to deploy; defaults to sha- plus the commit SHA
        required: false
        type: string
      deploy:
        description: Deploy to staging after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stage-deploy
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.15.8"
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run application tests
        run: python -m pytest app/tests
      - name: Run application lint
        run: python -m ruff check app
      - name: Audit Python dependencies
        run: python -m pip_audit -r app/requirements.txt
      - name: Build application image
        run: docker build --tag cloudops-demo:${{ github.sha }} ./app
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Format Terraform
        run: terraform fmt -check -recursive
      - name: Validate Terraform roots
        run: |
          for directory in bootstrap/backend environments/staging modules/*; do
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done

  base_plan:
    name: Generate base plan
    needs: validate
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      project_name: ${{ steps.config.outputs.project_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Validate AWS deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || {
            echo "::error::AWS_REGION Actions variable is not configured"
            exit 1
          }
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "::error::AWS_DEPLOY_ROLE_ARN Actions variable is not configured"
            exit 1
          }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-base-plan
      - name: Create staging variables
        id: config
        working-directory: environments/staging
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.TF_PROJECT_NAME }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          test -n "$AWS_REGION"
          test -n "$PROJECT_NAME"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_REGION"
          cat > terraform.tfvars <<EOF
          aws_region = "$AWS_REGION"
          project_name = "$PROJECT_NAME"
          certificate_arn = "$CERTIFICATE_ARN"
          EOF
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
      - name: Initialize Terraform
        working-directory: environments/staging
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION"
      - name: Generate base plan
        working-directory: environments/staging
        run: terraform plan -input=false -out=base.tfplan -var-file=terraform.tfvars -var="image_tag=bootstrap" -var="desired_capacity=0" -var="min_size=0"
      - name: Display base plan
        working-directory: environments/staging
        run: terraform show -no-color base.tfplan
      - name: Upload reviewed base plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-base-plan-${{ github.run_id }}
          path: environments/staging/base.tfplan
          retention-days: 1

  deploy_staging:
    name: Approve and deploy staging
    needs: base_plan
    environment: staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Validate AWS deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || {
            echo "::error::AWS_REGION Actions variable is not configured"
            exit 1
          }
          test -n "$AWS_DEPLOY_ROLE_ARN" || {
            echo "::error::AWS_DEPLOY_ROLE_ARN Actions variable is not configured"
            exit 1
          }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}-staging-deploy
      - name: Initialize Terraform
        working-directory: environments/staging
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$TF_STATE_REGION"
      - name: Download reviewed base plan
        uses: actions/download-artifact@v4
        with:
          name: staging-base-plan-${{ github.run_id }}
          path: environments/staging
      - name: Apply reviewed base plan
        working-directory: environments/staging
        run: terraform apply -input=false base.tfplan
      - name: Read ECR repository URL
        id: ecr
        working-directory: environments/staging
        run: echo "repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
      - name: Build or verify immutable image
        id: image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ steps.ecr.outputs.repository }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${REQUESTED_TAG:-sha-${EXPECTED_REVISION}}"
          REGISTRY="${ECR_REPOSITORY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            docker pull "$ECR_REPOSITORY:$IMAGE_TAG"
            REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ECR_REPOSITORY:$IMAGE_TAG")"
            test "$REVISION" != "<no value>"
            test -n "$REVISION"
            if [ -n "$REQUESTED_TAG" ]; then
              echo "Reusing existing rollback image $IMAGE_TAG with revision $REVISION"
            else
              test "$REVISION" = "$EXPECTED_REVISION"
              echo "Reusing existing image $IMAGE_TAG for this commit"
            fi
          else
            test -z "$REQUESTED_TAG"
            docker build --label "org.opencontainers.image.revision=$EXPECTED_REVISION" --tag "$ECR_REPOSITORY:$IMAGE_TAG" ./app
            docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Generate rollout plan
        working-directory: environments/staging
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: terraform plan -input=false -out=rollout.tfplan -var-file=terraform.tfvars -var="image_tag=$IMAGE_TAG"
      - name: Display rollout plan
        working-directory: environments/staging
        run: terraform show -no-color rollout.tfplan
      - name: Apply rollout plan
        working-directory: environments/staging
        run: terraform apply -input=false rollout.tfplan
