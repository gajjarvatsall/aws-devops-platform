name: Application release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable ECR image tag to roll back to (blank builds this commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-terraform-state
  cancel-in-progress: false

jobs:
  validate:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: python -m pip install --requirement app/requirements-dev.txt
      - run: python -m pytest app/tests
      - run: python -m ruff check app
      - run: python -m pip_audit --requirement app/requirements-dev.txt
      - run: ./scripts/validate-config.sh
      - name: Validate the container build
        run: docker build --tag cloudops-demo:${GITHUB_SHA} ./app

  release:
    name: Build and deploy application
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging-app
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "337909740274"
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: 337909740274.dkr.ecr.ap-south-1.amazonaws.com/cloudops-demo-staging/app
      IMAGE_PARAMETER: /cloudops-demo-staging/image-tag
      ASG_NAME: cloudops-demo-staging-app-asg
      ALB_NAME: cloudops-demo-staging-alb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure application deployment AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::337909740274:role/cloudops-github-app-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: app-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"

      - name: Build or select immutable application image
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${REQUESTED_TAG:-sha-${GITHUB_SHA}}"
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          ERROR_FILE="$RUNNER_TEMP/ecr-describe-error"
          if [[ -n "$REQUESTED_TAG" ]]; then
            aws ecr describe-images --repository-name cloudops-demo-staging/app --image-ids "imageTag=$IMAGE_TAG" >/dev/null
          elif aws ecr describe-images --repository-name cloudops-demo-staging/app --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>"$ERROR_FILE"; then
            docker pull "$ECR_REPOSITORY:$IMAGE_TAG"
            REVISION="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ECR_REPOSITORY:$IMAGE_TAG")"
            test "$REVISION" = "$GITHUB_SHA"
          else
            if ! grep -q 'ImageNotFoundException' "$ERROR_FILE"; then
              cat "$ERROR_FILE" >&2
              exit 1
            fi
            docker build --pull \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "$ECR_REPOSITORY:$IMAGE_TAG" ./app
            docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Point staging at the selected image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: aws ssm put-parameter --name "$IMAGE_PARAMETER" --type String --value "$IMAGE_TAG" --overwrite

      - name: Activate staging capacity and refresh existing instances
        id: refresh
        timeout-minutes: 35
        run: |
          set -euo pipefail
          RUNNING_BEFORE="$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`]|length(@)' --output text)"
          aws autoscaling update-auto-scaling-group --auto-scaling-group-name "$ASG_NAME" --min-size 2 --desired-capacity 2
          if [[ "$RUNNING_BEFORE" =~ ^[1-9][0-9]*$ ]]; then
            REFRESH_ID="$(aws autoscaling start-instance-refresh --auto-scaling-group-name "$ASG_NAME" \
              --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"SkipMatching":false,"AutoRollback":false}' \
              --query InstanceRefreshId --output text)"
            echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
            DEADLINE=$((SECONDS + 1800))
            while (( SECONDS < DEADLINE )); do
              REFRESH="$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG_NAME" \
                --instance-refresh-ids "$REFRESH_ID" --query 'InstanceRefreshes[0].{Status:Status,Reason:StatusReason,Percentage:PercentageComplete,Updated:InstancesUpdated,ToUpdate:InstancesToUpdate}' --output json)"
              STATUS="$(jq -r '.Status' <<< "$REFRESH")"
              echo "Instance refresh: $REFRESH"
              TARGET_GROUP_ARN="$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].TargetGroupARNs[0]' --output text)"
              aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
                --query 'TargetHealthDescriptions[*].{Id:Target.Id,State:TargetHealth.State,Reason:TargetHealth.Reason,Description:TargetHealth.Description}' \
                --output table || true
              case "$STATUS" in
                Successful) break ;;
                Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                  echo "Auto Scaling instance refresh finished with status $STATUS." >&2
                  exit 1 ;;
              esac
              sleep 15
            done
            if [[ "$STATUS" != "Successful" ]]; then
              aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG_NAME" \
                --instance-refresh-ids "$REFRESH_ID" --output table
              echo "Timed out waiting for Auto Scaling instance refresh." >&2
              exit 1
            fi
          else
            echo "No existing in-service instance; capacity activation will launch directly from the selected image."
          fi

      - name: Wait for healthy application targets
        timeout-minutes: 20
        run: |
          set -euo pipefail
          AWS_ARGS=(--region "$AWS_REGION" --cli-connect-timeout 10 --cli-read-timeout 20)
          TARGET_GROUP_ARN="$(aws "${AWS_ARGS[@]}" autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].TargetGroupARNs[0]' --output text)"
          ALB_DNS="$(aws "${AWS_ARGS[@]}" elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text)"
          DEADLINE=$((SECONDS + 900))
          HEALTHY=0
          while (( SECONDS < DEADLINE )); do
            TARGET_HEALTH="$(aws "${AWS_ARGS[@]}" elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'TargetHealthDescriptions[*].{Id:Target.Id,State:TargetHealth.State,Reason:TargetHealth.Reason,Description:TargetHealth.Description}' \
              --output table)"
            printf '%s\n' "$TARGET_HEALTH"
            HEALTHY="$(aws "${AWS_ARGS[@]}" elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' --output text)"
            if (( HEALTHY >= 2 )); then break; fi
            sleep 15
          done
          if (( HEALTHY < 2 )); then
            aws "${AWS_ARGS[@]}" elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" --output table
            echo "Timed out waiting for a healthy staging target." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 10 --retry-delay 6 "http://$ALB_DNS/health"
          APP_URL="http://$ALB_DNS"
          echo "Staging is healthy at $APP_URL"
          {
            echo "## Staging application release"
            echo "- Image: $ECR_REPOSITORY:${{ steps.image.outputs.tag }}"
            echo "- Healthy targets: $HEALTHY"
            echo "- Application URL: $APP_URL"
            echo "- Health check: $APP_URL/health"
          } >> "$GITHUB_STEP_SUMMARY"
