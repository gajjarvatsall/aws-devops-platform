name: Terraform deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, staging, prod]
      image_tag:
        description: Immutable ECR image tag
        required: true
        type: string
      apply:
        description: Apply the reviewed plan
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - name: Initialize
        working-directory: environments/${{ inputs.environment }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.TF_STATE_REGION }}"
      - name: Plan
        working-directory: environments/${{ inputs.environment }}
        run: terraform plan -input=false -out=tfplan -var="image_tag=${{ inputs.image_tag }}" -var-file=terraform.tfvars
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: environments/${{ inputs.environment }}/tfplan
          retention-days: 1
  apply:
    needs: plan
    if: ${{ inputs.apply == true }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: environments/${{ inputs.environment }}
      - name: Initialize
        working-directory: environments/${{ inputs.environment }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.TF_STATE_REGION }}"
      - name: Apply reviewed plan
        working-directory: environments/${{ inputs.environment }}
        run: terraform apply -input=false tfplan

