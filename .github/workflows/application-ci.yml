name: Application CI

on:
  pull_request:
    paths: ["app/**", "Dockerfile", ".github/workflows/application-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/application-ci.yml"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: python -m pip install -r app/requirements.txt
      - run: python -m pytest app/tests
      - run: python -m ruff check app
      - run: python -m pip_audit -r app/requirements.txt
      - run: docker build --tag cloudops-demo:${{ github.sha }} ./app

